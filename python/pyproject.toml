[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qontext-hw"
version = "1.1.0"
description = "Measure Qontext's contextuality circuits on quantum hardware and write measurement pools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qiskit>=2.0",
  "qiskit-aer>=0.17",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qontext-probe = "qontext_hw.cli:main"
qontext-hw = "qontext_hw.cli:main"  # original name, kept so existing scripts keep working

[tool.setuptools]
packages = ["qontext_hw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

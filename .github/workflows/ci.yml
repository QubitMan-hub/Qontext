name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions on Node 24 (Node 20 actions are deprecated). Runners pinned to Ubuntu 24.04 so the move of
# ubuntu-latest to Ubuntu 26 cannot break Playwright's Chromium system packages without notice.

jobs:
  web:
    name: Engine, Studio, runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Built files are up to date
        run: git diff --exit-code -- dist figma-plugin/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          pip install pytest playwright==1.56.0 pillow numpy
          python -m playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: python -m pytest tests/e2e -q

  python:
    name: Hardware runner (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e './python[dev]'
      - run: ruff check python scripts tests film/scripts
      - run: ruff format --check python scripts tests film/scripts
      - run: pytest python -q
